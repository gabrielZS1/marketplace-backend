# Perfil de produção. Ative com: SPRING_PROFILES_ACTIVE=prod
#
# Variáveis de ambiente obrigatórias no host:
#   JWT_SECRET, DB_URL, DB_USERNAME, DB_PASSWORD,
#   MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, APP_BASE_URL, ADMIN_EMAIL,
#   CORS_ALLOWED_ORIGINS, RESEND_API_KEY, RESEND_FROM,
#   GOOGLE_OAUTH_CLIENT_IDS, RATELIMIT_BEHIND_PROXY=true
#   (quando tiver domínio de e-mail: REQUIRE_VERIFIED_EMAIL=true)
#   (quando o Turnstile estiver ativo: TURNSTILE_ENABLED=true, TURNSTILE_SECRET_KEY)

# Logs enxutos
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
server.error.whitelabel.enabled=false

# Atrás de proxy (Render/Cloudflare): confia nos headers X-Forwarded-* / CF-Connecting-IP
app.ratelimit.behind-proxy=true
server.forward-headers-strategy=framework

# Não manter sessão do Hibernate aberta durante a resposta
spring.jpa.open-in-view=false

# Pool pequeno — o pooler grátis do Supabase tem poucas conexões
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=280000

# Encerra rápido em deploy/restart
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
