# Perfil de produção. Ative com: SPRING_PROFILES_ACTIVE=prod
#
# Variáveis de ambiente obrigatórias no host:
#   JWT_SECRET, DB_URL, DB_USERNAME, DB_PASSWORD,
#   MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET, APP_BASE_URL, ADMIN_EMAIL,
#   CORS_ALLOWED_ORIGINS, RESEND_API_KEY, RESEND_FROM,
#   GOOGLE_OAUTH_CLIENT_IDS, RATELIMIT_BEHIND_PROXY=true
#   (quando tiver domínio de e-mail: REQUIRE_VERIFIED_EMAIL=true)
#   (quando o Turnstile estiver ativo: TURNSTILE_ENABLED=true, TURNSTILE_SECRET_KEY)

# Logs enxutos
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
server.error.whitelabel.enabled=false

# Atrás de proxy (Render/Cloudflare): confia nos headers X-Forwarded-* / CF-Connecting-IP
app.ratelimit.behind-proxy=true
server.forward-headers-strategy=framework

# Sessão do Hibernate aberta durante a resposta.
# Necessário: os controllers montam os DTOs a partir de associações LAZY
# (ex.: employee.getUser().getName(), appointment.getEmployee()...) fora de
# transação. Com open-in-view=false qualquer endpoint que serializa uma
# entidade com relação lazy estoura LazyInitializationException -> HTTP 500
# (funciona local só porque lá o padrão é true).
# Custo: cada request segura uma conexão do pool até o fim da resposta —
# aceitável no volume atual. Otimização futura: JOIN FETCH / @EntityGraph nos
# endpoints de leitura quentes e então voltar isto para false.
spring.jpa.open-in-view=true

# Pool — o pooler do Supabase aguenta bem mais; com open-in-view=true cada
# request segura a conexão por mais tempo, então um pouco de folga ajuda.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=280000

# Encerra rápido em deploy/restart
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
