spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/marketplace}
spring.datasource.username=${DB_USERNAME:marketplace_admin}
spring.datasource.password=${DB_PASSWORD:troque_esta_senha_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Em produção, sobrescrito por application-prod.properties (SPRING_PROFILES_ACTIVE=prod)
logging.level.org.springframework.security=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Render/Railway injetam a porta via env var PORT; local cai no 8082.
server.port=${PORT:8082}

# Honra X-Forwarded-* quando atrás de proxy / Cloudflare (IP real, https)
server.forward-headers-strategy=framework

# Nunca vazar stack trace / detalhes internos em erros não tratados
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Segredos: sem valor real no arquivo. Defina por variável de ambiente
# (local: .env do IDE / run config; produção: env vars do host).
# Token de teste do Mercado Pago começa com TEST-; o de produção com APP_USR-.
mercadopago.access-token=${MP_ACCESS_TOKEN:CHANGE_ME_MP_ACCESS_TOKEN}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:CHANGE_ME_MP_WEBHOOK_SECRET}
app.base-url=${APP_BASE_URL:http://192.168.15.27:8082}
app.subscription.grace-period-days=4
# Dias de teste pra quem entra SEM código promocional (fora do lançamento).
app.subscription.default-trial-days=7

app.admin-email=${ADMIN_EMAIL:admin@example.com}

# Em produção defina JWT_SECRET (>= 64 chars aleatórios). O valor antigo que ficava
# aqui foi rotacionado e deve ser tratado como comprometido.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0000000000000000000000000000000000}

# CORS: origens permitidas (só afeta clientes de navegador; o app mobile ignora)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8083,http://localhost:19006}

# Rate limiting (por IP). Desligue só em testes automatizados.
app.ratelimit.enabled=${RATELIMIT_ENABLED:true}
# true quando o backend roda atrás de Cloudflare/nginx (pra confiar no IP real dos headers).
app.ratelimit.behind-proxy=${RATELIMIT_BEHIND_PROXY:false}

# E-mail transacional (Resend). Sem a API key, os e-mails são só logados (dev).
resend.api-key=${RESEND_API_KEY:}
# Enquanto não houver domínio verificado, o Resend só entrega de onboarding@resend.dev
# e apenas para o e-mail dono da conta Resend.
resend.from=${RESEND_FROM:Glowly <onboarding@resend.dev>}

# "Entrar com Google": IDs de cliente OAuth aceitos como audience do ID token
# (Web + iOS + Android, separados por vírgula). Vazio = login Google desativado.
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}

# Quando true, o dono precisa ter e-mail verificado pra concluir o onboarding.
# Deixe false até ter domínio de e-mail configurado.
app.auth.require-verified-email=${REQUIRE_VERIFIED_EMAIL:false}

# CAPTCHA no cadastro (Cloudflare Turnstile). Só valida quando enabled=true E há secret.
turnstile.enabled=${TURNSTILE_ENABLED:false}
turnstile.secret-key=${TURNSTILE_SECRET_KEY:}

# Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload.dir=${UPLOAD_DIR:uploads}
