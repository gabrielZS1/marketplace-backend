<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>Assinatura — Glowly Business</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 80px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #111827; background: #f7f7f8;
    max-width: 460px; margin-inline: auto;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #ececec; background: #111111; }
    .card { background: #1b1b1c !important; border-color: #2b2b2d !important; }
    input { background: #111 !important; color: #ececec !important; border-color: #333 !important; }
    .muted { color: #9a9aa0 !important; }
    button { background: #f3f4f6; color: #111827; }
    button.ghost { background: transparent; color: #ececec; }
    .row { border-bottom-color: #2b2b2d; }
  }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .muted { color: #6b7280; font-size: .92rem; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px; margin-top: 20px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; height: 48px; padding: 0 14px; font-size: 1rem;
    border: 1px solid #d1d5db; border-radius: 12px; background: #fff; color: inherit;
  }
  button {
    width: 100%; height: 52px; margin-top: 20px; border: 0; border-radius: 14px;
    background: #111827; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost { background: transparent; color: inherit; margin-top: 8px; font-weight: 500; }
  .error { color: #dc2626; font-size: .92rem; margin-top: 14px; min-height: 1.2em; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
  .row:last-of-type { border-bottom: 0; }
  .price { font-size: 1.7rem; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>Assinatura Glowly Business</h1>
<p class="muted">Entre com a conta do dono do estabelecimento para ver o seu plano e assinar.</p>

<div id="login" class="card">
  <form id="loginForm" autocomplete="on">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Entrar</button>
  </form>
  <p id="loginError" class="error" role="alert"></p>
</div>

<div id="plan" class="card" hidden>
  <p class="muted" id="bizName"></p>
  <div class="row"><span>Situação</span><b id="status"></b></div>
  <div class="row"><span>Plano</span><b id="team"></b></div>
  <div class="row"><span>Valor mensal</span><b class="price" id="price"></b></div>
  <p class="muted" id="statusNote"></p>
  <button id="payBtn" type="button">Assinar</button>
  <button id="logoutBtn" type="button" class="ghost">Sair</button>
  <p id="planError" class="error" role="alert"></p>
  <p class="muted">O pagamento é feito no Mercado Pago. Nenhum dado de cartão passa pelo Glowly.</p>
</div>

<script src="/assinar/assinar.js"></script>
</body>
</html>
