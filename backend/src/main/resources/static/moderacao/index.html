<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>Moderação — Glowly</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --card: #fff; --line: #e5e7eb; --text: #111827; --muted: #6b7280;
    --btn: #111827; --btn-text: #fff; --danger: #b91c1c; --chip: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111; --card: #1b1b1c; --line: #2b2b2d; --text: #ececec; --muted: #9a9aa0;
      --btn: #f3f4f6; --btn-text: #111827; --danger: #f87171; --chip: #26262a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 32px 16px 80px; max-width: 760px;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
  }
  h1 { font-size: 1.45rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 14px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 12px 0 6px; }
  input {
    width: 100%; height: 46px; padding: 0 12px; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: inherit;
  }
  button {
    height: 40px; padding: 0 16px; border: 1px solid transparent; border-radius: 10px;
    background: var(--btn); color: var(--btn-text); font-size: .92rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  button.danger { background: var(--danger); color: #fff; }
  .wide { width: 100%; height: 48px; margin-top: 18px; }
  .error { color: var(--danger); font-size: .9rem; min-height: 1.2em; margin: 10px 0 0; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }
  .tabs button[aria-pressed="false"] { background: transparent; color: var(--text); border-color: var(--line); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-size: .78rem; font-weight: 600; margin-right: 6px; }
  .target { display: flex; gap: 12px; margin: 12px 0; }
  .target img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; background: var(--chip); }
  .target p { margin: 2px 0; overflow-wrap: anywhere; }
  .quote { white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .empty { text-align: center; padding: 28px 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>Moderação</h1>
<p class="muted">Denúncias de avaliações e estabelecimentos feitas pelos clientes. Uso interno.</p>

<div id="login" class="card">
  <form id="loginForm" autocomplete="on">
    <label for="email">E-mail do administrador</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" class="wide" type="submit">Entrar</button>
  </form>
  <p id="loginError" class="error" role="alert"></p>
</div>

<div id="panel" hidden>
  <div class="card bar">
    <div class="tabs" role="group" aria-label="Filtro">
      <button type="button" data-status="OPEN" aria-pressed="true">Abertas</button>
      <button type="button" data-status="ACTIONED" aria-pressed="false">Removidas</button>
      <button type="button" data-status="DISMISSED" aria-pressed="false">Descartadas</button>
    </div>
    <div class="actions" style="margin:0">
      <button id="reloadBtn" type="button" class="ghost">Atualizar</button>
      <button id="logoutBtn" type="button" class="ghost">Sair</button>
    </div>
  </div>
  <p id="panelError" class="error" role="alert"></p>
  <div id="list"></div>

  <h2>Estabelecimentos suspensos</h2>
  <div id="suspended"></div>
</div>

<script src="/moderacao/moderacao.js"></script>
</body>
</html>
