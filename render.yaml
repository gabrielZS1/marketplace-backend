# Blueprint do Render. Importa em: Render -> New -> Blueprint -> aponta pro repo.
# O banco NÃO fica aqui — é o Supabase (Postgres gerenciado). As variáveis
# marcadas com sync:false você preenche no painel do Render depois de importar.
services:
  - type: web
    name: glowly-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /legal/termos
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: RATELIMIT_BEHIND_PROXY
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: REQUIRE_VERIFIED_EMAIL
        value: "false"
      - key: TURNSTILE_ENABLED
        value: "false"
